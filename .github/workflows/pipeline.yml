name: Daily weather ETL

on:
  schedule:
    # 06:00 UTC daily. GitHub Actions cron can slip under load - that's
    # exactly what dq.check_freshness's slack (MAX_STALENESS_HOURS) covers.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # adds a "Run workflow" button in the Actions tab, for manual runs/testing

permissions:
  contents: read
  issues: write # lets the failure step below open an issue

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run pipeline (retry a couple of times before giving up)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: weather
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            python run_pipeline.py && exit 0
            echo "Attempt $attempt failed, waiting 30s before retrying..."
            sleep 30
          done
          echo "All 3 attempts failed."
          exit 1

      # Retrying helps with a flaky API call, but a real data-quality
      # failure is deterministic - it'll fail all 3 attempts the same way,
      # then land here. GitHub also emails the repo owner on a failed
      # scheduled run by default; this step additionally leaves a record
      # inside the repo itself.
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline failed: run #${context.runNumber}`,
              body: `The daily weather ETL pipeline failed after 3 attempts. Logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
