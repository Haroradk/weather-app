# Semantic layer + data catalog: the single place where gold tables, their
# columns, and business metrics are described. src/catalog.py applies this
# to the warehouse on every pipeline run (as DuckDB COMMENTs and a
# gold.metric_definitions table), so the dashboard, the weather-agent, and
# anyone browsing MotherDuck all read the same definitions.

tables:
  gold.weather_daily_summary:
    description: >-
      One row per city per day, aggregated from hourly readings. Blends two kinds of rows
      in the same table: settled history (date <= CURRENT_DATE) and Open-Meteo's own forecast
      for the next ~7 days (date > CURRENT_DATE). MAX(date) is therefore NOT today - filter
      date <= CURRENT_DATE for anything about what actually happened.
    columns:
      city: City name - one of Copenhagen, London, New York.
      date: Calendar day (UTC). Rows after CURRENT_DATE are Open-Meteo forecasts, not observations.
      temp_min_c: Lowest hourly temperature that day, degrees Celsius.
      temp_max_c: Highest hourly temperature that day, degrees Celsius.
      temp_avg_c: Mean of the 24 hourly temperatures that day, degrees Celsius.
      precipitation_sum_mm: Total precipitation that day, millimetres (sum of hourly values).
      wind_speed_max_kmh: Highest hourly wind speed that day, km/h.
      updated_at: When the pipeline last rebuilt this row.

  gold.weather_forecast:
    description: >-
      Our own ML next-day predictions (not Open-Meteo's forecast). One row per city per
      target date. is_backtest separates live daily predictions from retroactive walk-forward
      backtest points.
    columns:
      city: City name - one of Copenhagen, London, New York.
      target_date: The day being predicted.
      predicted_temp_min_c: Predicted lowest temperature, degrees Celsius.
      predicted_temp_max_c: Predicted highest temperature, degrees Celsius.
      predicted_temp_avg_c: Predicted mean temperature, degrees Celsius.
      predicted_precipitation_sum_mm: Predicted total precipitation, millimetres (clipped at 0).
      predicted_wind_speed_max_kmh: Predicted highest wind speed, km/h (clipped at 0).
      model_type: Which model produced the prediction, e.g. linear_regression_v1.
      training_rows: How many settled days the model was trained on.
      is_backtest: TRUE = retroactive backtest point, FALSE = real live prediction made the day before.
      trained_at: When the model was trained (UTC).

  gold.forecast_evaluation:
    description: >-
      View pairing each of our predictions with what actually happened. Only fully settled
      days (target_date < CURRENT_DATE) - today is excluded because its later hours are still
      forecast, and joining to future rows would compare our forecast against Open-Meteo's.
    columns:
      city: City name.
      target_date: The day that was predicted.
      is_backtest: TRUE = retroactive backtest point, FALSE = real live prediction.
      model_type: Which model produced the prediction.
      predicted_temp_min_c: Predicted lowest temperature, degrees Celsius.
      actual_temp_min_c: Actual lowest temperature, degrees Celsius.
      predicted_temp_max_c: Predicted highest temperature, degrees Celsius.
      actual_temp_max_c: Actual highest temperature, degrees Celsius.
      predicted_temp_avg_c: Predicted mean temperature, degrees Celsius.
      actual_temp_avg_c: Actual mean temperature, degrees Celsius.
      predicted_precipitation_sum_mm: Predicted total precipitation, millimetres.
      actual_precipitation_sum_mm: Actual total precipitation, millimetres.
      predicted_wind_speed_max_kmh: Predicted highest wind speed, km/h.
      actual_wind_speed_max_kmh: Actual highest wind speed, km/h.

  gold.metric_definitions:
    description: >-
      Business metric definitions from semantic_layer.yml. To compute a metric:
      SELECT <group-by columns>, <expression> FROM <table_name> WHERE <filter> GROUP BY ...
    columns:
      name: Metric identifier.
      label: Human-readable name.
      description: What the metric means, in plain English.
      table_name: Table or view the metric is computed from.
      expression: SQL aggregate expression that computes the metric.
      filter: SQL WHERE condition that must always be applied with this metric.
      unit: Unit of the result.

  gold.lineage_edges:
    description: >-
      Data lineage from semantic_layer.yml: one row per dependency edge, showing which node is
      built from which. Use it to answer "where does this data come from?" or "what breaks if
      X changes?".
    columns:
      upstream: The node data flows from (a table, view, file, or external source).
      downstream: The node data flows into.
      upstream_type: source, file, table, view, or consumer.
      downstream_type: source, file, table, view, or consumer.
      built_by: Code file that builds the downstream node, if any.

  gold.forecaster_vs_model_vs_actual:
    description: >-
      New York only. One row per target date: what National Weather Service forecasters wrote
      in their Area Forecast Discussion (extracted by an LLM from free text), what our own ML
      model predicted, and what actually happened. Actual columns are NULL until the day has
      fully passed. Caveats - our days are UTC days, forecasters mean New York local days; our
      wind is max sustained speed while forecasters quote gusts, so the wind columns are not
      like-for-like.
    columns:
      city: Always New York - the NWS only covers the US.
      target_date: The day being forecast.
      discussion_issued_at: When the forecaster discussion used was issued (UTC) - the latest one before our 06:00 UTC run the day before.
      forecaster_rain_expected: none, possible, or likely - forecasters' rain expectation for NYC, extracted from their text.
      forecaster_temp_max_c: Forecasters' stated NYC high, converted to °C. Usually NULL - the text rarely gives a single NYC number.
      forecaster_temp_min_c: Forecasters' stated NYC low, converted to °C. Usually NULL.
      forecaster_wind_gust_max_kmh: Forecasters' stated max wind gust, converted to km/h. NULL if not stated.
      forecaster_hazards: Hazards the forecasters mention for that day, e.g. coastal flooding.
      forecaster_summary: One-sentence LLM summary of the forecasters' view of that day.
      evidence_verified: TRUE if the LLM's supporting quote was found word for word in the source text. Unverified rows are not scored.
      model_temp_max_c: Our ML model's predicted high, °C.
      model_temp_min_c: Our ML model's predicted low, °C.
      model_precipitation_sum_mm: Our ML model's predicted rainfall, mm.
      model_is_backtest: TRUE if the model value is a retroactive backtest point rather than a live prediction.
      actual_temp_max_c: Actual high, °C (UTC day).
      actual_temp_min_c: Actual low, °C (UTC day).
      actual_precipitation_sum_mm: Actual rainfall, mm (UTC day).
      actual_wind_speed_max_kmh: Actual max sustained hourly wind speed, km/h - not a gust.
      forecaster_rain_correct: Did the forecasters' rain call match reality (rainy = more than 1 mm)? NULL for 'possible', unverified evidence, or unsettled days.
      model_rain_correct: Did our model's rain call (predicted more than 1 mm) match reality? NULL until the day has passed.

  ops.pipeline_runs:
    description: >-
      Operational metadata, not weather data - one row per pipeline run (each GitHub Actions retry
      attempt is its own run). Feeds the dashboard's pipeline health lights.
    columns:
      run_id: Run identifier (its start time, UTC).
      started_at: When the run started (UTC).
      finished_at: When the run finished or failed (UTC).
      status: success (all checks passed), warning (at least one check warned), or failed (a step or check stopped the run).
      n_pass: Number of checks that passed.
      n_warn: Number of checks that warned.
      n_fail: Number of checks that failed (0 or 1 - the first failure stops the run).
      error: The error that stopped the run, if it failed.
      triggered_by: schedule, workflow_dispatch (manual button), or local.

  ops.dq_results:
    description: One row per data quality check per pipeline run - pass, warn, or fail, with the detail.
    columns:
      run_id: The run this check belongs to (joins to ops.pipeline_runs).
      checked_at: When the check ran (UTC).
      step: Pipeline step the check belongs to - bronze, silver, gold, forecast, discussions, catalog.
      check_name: Which check, e.g. check_freshness.
      target: The table, schema, or thing checked.
      status: pass, warn, or fail.
      detail: What the check found, in words.

metrics:
  - name: rainy_days
    label: Rainy days
    description: Number of days with more than 1 mm of total precipitation.
    table: gold.weather_daily_summary
    expression: COUNT(*) FILTER (WHERE precipitation_sum_mm > 1)
    filter: date <= CURRENT_DATE
    unit: days

  - name: avg_temperature
    label: Average temperature
    description: Mean of daily average temperatures.
    table: gold.weather_daily_summary
    expression: ROUND(AVG(temp_avg_c), 1)
    filter: date <= CURRENT_DATE
    unit: °C

  - name: total_precipitation
    label: Total precipitation
    description: Sum of daily precipitation.
    table: gold.weather_daily_summary
    expression: ROUND(SUM(precipitation_sum_mm), 1)
    filter: date <= CURRENT_DATE
    unit: mm

  - name: max_wind_speed
    label: Peak wind speed
    description: Highest daily max wind speed.
    table: gold.weather_daily_summary
    expression: ROUND(MAX(wind_speed_max_kmh), 1)
    filter: date <= CURRENT_DATE
    unit: km/h

  - name: forecast_mae_temp_avg
    label: Forecast error (avg temp)
    description: Mean absolute error of our average-temperature predictions against what actually happened.
    table: gold.forecast_evaluation
    expression: ROUND(AVG(ABS(predicted_temp_avg_c - actual_temp_avg_c)), 2)
    filter: "TRUE"
    unit: °C

  - name: forecaster_rain_hit_rate
    label: Forecaster rain hit rate
    description: Share of days where the NWS forecasters' rain call was right. Scored only on days where our model can be scored too, so the two rates are comparable.
    table: gold.forecaster_vs_model_vs_actual
    expression: ROUND(AVG(CAST(forecaster_rain_correct AS INTEGER)), 2)
    filter: forecaster_rain_correct IS NOT NULL AND model_rain_correct IS NOT NULL
    unit: share of days

  - name: model_rain_hit_rate
    label: Model rain hit rate
    description: Share of days where our ML model's rain call was right, on the same days the forecasters are scored.
    table: gold.forecaster_vs_model_vs_actual
    expression: ROUND(AVG(CAST(model_rain_correct AS INTEGER)), 2)
    filter: forecaster_rain_correct IS NOT NULL AND model_rain_correct IS NOT NULL
    unit: share of days

# Lineage: every node and what it's built from. Declared here (the way dbt
# models declare ref()), then verified against reality on every pipeline run
# by dq.check_lineage - the warehouse's actual tables, view SQL, and which
# tables each code file reads - so this can't silently drift from the code.
lineage:
  open_meteo_api:
    type: source
    label: Open-Meteo API
  bronze.raw_weather_observations:
    type: table
    built_by: src/bronze.py
    upstream: [open_meteo_api]
  silver.weather_hourly:
    type: table
    built_by: src/silver.py
    upstream: [bronze.raw_weather_observations]
  gold.weather_daily_summary:
    type: table
    built_by: src/gold.py
    upstream: [silver.weather_hourly]
  gold.weather_forecast:
    type: table
    built_by: src/forecast.py
    upstream: [gold.weather_daily_summary]
  semantic_layer.yml:
    type: file
    label: semantic_layer.yml
  gold.forecast_evaluation:
    type: view
    built_by: src/catalog.py
    upstream: [gold.weather_forecast, gold.weather_daily_summary]
  gold.metric_definitions:
    type: table
    built_by: src/catalog.py
    upstream: [semantic_layer.yml]
  gold.lineage_edges:
    type: table
    built_by: src/catalog.py
    upstream: [semantic_layer.yml]
  nws_api:
    type: source
    label: NWS forecast discussions
  gemini_api:
    type: service
    label: Gemini (extraction + embeddings)
  bronze.raw_forecast_discussions:
    type: table
    built_by: src/discussion_bronze.py
    upstream: [nws_api]
  silver.forecast_discussion_sections:
    type: table
    built_by: src/discussion_silver.py
    upstream: [bronze.raw_forecast_discussions, gemini_api]
  silver.forecast_discussion_extractions:
    type: table
    built_by: src/discussion_silver.py
    upstream: [bronze.raw_forecast_discussions, gemini_api]
  gold.forecaster_vs_model_vs_actual:
    type: view
    built_by: src/discussion_gold.py
    upstream: [silver.forecast_discussion_extractions, gold.weather_forecast, gold.weather_daily_summary]
  ops.pipeline_runs:
    type: table
    built_by: src/dq.py
  ops.dq_results:
    type: table
    built_by: src/dq.py
  dashboard:
    type: consumer
    label: Dashboard (weather-app)
    built_by: app.py
    upstream:
      - bronze.raw_weather_observations
      - silver.weather_hourly
      - gold.weather_daily_summary
      - gold.weather_forecast
      - gold.forecast_evaluation
      - gold.metric_definitions
      - gold.lineage_edges
      - gold.forecaster_vs_model_vs_actual
      - ops.pipeline_runs
      - ops.dq_results
  weather_agent:
    type: consumer
    label: Weather agent (separate repo)
    upstream:
      - gold.weather_daily_summary
      - gold.weather_forecast
      - gold.forecast_evaluation
      - gold.metric_definitions
      - gold.lineage_edges
      - gold.forecaster_vs_model_vs_actual
      - silver.forecast_discussion_sections
